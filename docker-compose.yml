version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_interior_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ai_interior
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interior"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ai_interior_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@db:5432/ai_interior
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_DIR=/app/storage
      - OBJECT_DETECTOR_PROVIDER=yolo_local
      - DEPTH_ESTIMATOR_PROVIDER=depth_anything_local
      - LLM_PROVIDER=rule_based
      - IMAGE_GENERATOR_PROVIDER=structure_preserving_synth
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ai_interior_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
